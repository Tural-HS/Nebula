# Local development stack. Not for production: credentials here are dev-only.
name: nebula

services:
  postgres:
    image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula-dev-only
      POSTGRES_DB: nebula
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: nebula:dev
    build: .
    command: ["migrate", "up"]
    environment:
      NEBULA_DATABASE_URL: postgres://nebula:nebula-dev-only@postgres:5432/nebula?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: nebula:dev
    environment:
      NEBULA_ENV: development
      NEBULA_LOG_FORMAT: text
      NEBULA_DATABASE_URL: postgres://nebula:nebula-dev-only@postgres:5432/nebula?sslmode=disable
      # iss must match the browser-facing URL (KC_HOSTNAME); keys are fetched over the compose network.
      NEBULA_OIDC_ISSUER: http://localhost:8081/realms/nebula
      NEBULA_OIDC_AUDIENCE: nebula-api
      NEBULA_OIDC_JWKS_URL: http://keycloak:8080/realms/nebula/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  # Dev-only identity provider. start-dev uses an embedded H2 database and plain HTTP.
  # The realm is imported only when it does not exist yet. To re-import after editing
  # nebula-realm.json: docker compose rm -sf keycloak && docker volume rm nebula_kcdata.
  # Dev users have fixed IDs, so their token "sub" stays stable across re-imports.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/nebula-realm.json:/opt/keycloak/data/import/nebula-realm.json:ro
      # Persists the embedded H2 database, so realm keys and sessions survive container recreation.
      - kcdata:/opt/keycloak/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # No curl in the image: raw HTTP over bash /dev/tcp against the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200"* ]]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  kcdata:
