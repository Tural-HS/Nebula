name: release

# Builds and publishes the production images for a version tag (v*), signs them keylessly with
# cosign (GitHub OIDC) and attaches build provenance. deploy/production/scripts/deploy.sh then
# deploys them by digest; `deploy.sh --verify` checks the signatures.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Only version tags publish (also for manual runs: pick the tag in "Use workflow from").
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless + provenance
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: nebula
            context: .
            file: Dockerfile
          - name: nebula-web
            context: web
            file: deploy/production/web.Dockerfile
          - name: nebula-postgres
            context: deploy/production/postgres
            file: deploy/production/postgres/Dockerfile
          - name: nebula-keycloak
            context: deploy/production/keycloak
            file: deploy/production/keycloak/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ matrix.name }}
        run: |
          owner="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE}" >>"$GITHUB_OUTPUT"
          echo "tag=${REF_NAME}" >>"$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ github.ref_name }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          NAME: ${{ matrix.name }}
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          case "$NAME" in nebula) key=NEBULA_IMAGE ;; nebula-web) key=NEBULA_WEB_IMAGE ;; nebula-postgres) key=POSTGRES_IMAGE ;; nebula-keycloak) key=KEYCLOAK_IMAGE ;; esac
          echo "\`${key}=${REF}\`" >>"$GITHUB_STEP_SUMMARY"
