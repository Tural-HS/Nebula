# Keeps every dependency, base image digest and action SHA on the latest version.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  # Base images of the dev/API image and of the production images (Keycloak, Postgres,
  # Caddy + web). A new Keycloak release arrives as a PR; if it bundles a fixed guava, the
  # Keycloak build fails on purpose and asks to remove our guava override (ADR-0018).
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/production
      - /deploy/production/keycloak
      - /deploy/production/postgres
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/production
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-deps: { patterns: ["*"] }
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; remove this once it does.
      # Minor/patch updates of TypeScript 6 still arrive (security fixes included).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
