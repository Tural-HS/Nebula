<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nebula round 7 — B: Queue</title>
<script src="data.js?v=2"></script>
<style>
  :root {
    --brand-50: oklch(0.975 0.018 205); --brand-100: oklch(0.94 0.04 200); --brand-300: oklch(0.81 0.08 205); --brand-400: oklch(0.72 0.095 205);
    --brand-500: oklch(0.62 0.098 205); --brand-600: oklch(0.53 0.088 215); --brand-700: oklch(0.45 0.08 225); --brand-900: oklch(0.3 0.08 272); --brand-950: oklch(0.23 0.065 272);
    --bg: #f4f6f8; --surface: #fff; --line: #e2e6ea; --line-soft: #edf0f3; --text: #141821; --muted: #646b78; --faint: #9aa1ad;
    --band: var(--brand-900); --band-text: #e9edf7; --band-muted: #a9b3cc; --band-line: oklch(0.38 0.08 265);
    --group: #f8fafb; --hover: #f3f7f8; --sel: var(--brand-50);
    --red: #c81e1e; --red-bg: #fdecec; --amber: #a3530a; --amber-bg: #fff3dc; --amber-mark: #f59e0b; --green: #15803d; --green-bg: #e7f6ec;
    --chip: #eef1f4; --scrim: rgba(20,24,33,.32);
    color-scheme: light;
  }
  .dark {
    --bg: #0b0d12; --surface: #141720; --line: #262b36; --line-soft: #1c2029; --text: #e9ecf2; --muted: #9aa1ad; --faint: #6a7180;
    --band: var(--brand-950); --band-text: #e9edf7; --band-muted: #9aa6c2; --band-line: oklch(0.32 0.07 268);
    --group: #10131a; --hover: #1a1f2a; --sel: oklch(0.3 0.05 215 / .5);
    --red: #f87171; --red-bg: #3a1515; --amber: #fbbf24; --amber-bg: #392a0d; --green: #4ade80; --green-bg: #12301d;
    --chip: #222734; --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  .app { display: flex; flex-direction: column; height: 100vh; position: relative; }

  header { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: var(--band); color: var(--band-text); flex-shrink: 0; }
  header img { width: 28px; height: 28px; }
  .crumbs { color: var(--band-muted); font-size: 13px; display: flex; gap: 6px; }
  .crumbs b { color: var(--band-text); font-weight: 600; }
  .hdr-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .ghost { border: 0; background: none; padding: 6px 8px; border-radius: 6px; color: inherit; opacity: .85; }

  /* Queue strip: the counts are the filters. */
  .queues { display: flex; gap: 4px; padding: 0 12px; background: var(--band); border-top: 1px solid var(--band-line); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
  .q { border: 0; background: none; color: var(--band-muted); text-align: left; padding: 10px 14px 12px; border-bottom: 3px solid transparent; white-space: nowrap; }
  .q strong { display: block; font-size: 22px; line-height: 1.1; font-weight: 650; color: var(--band-text); letter-spacing: -.02em; }
  .q span { font-size: 12px; }
  .q[aria-pressed="true"] { border-bottom-color: var(--brand-400); color: var(--band-text); }
  .q.late strong { color: #ff9a9a; }
  .q.appr strong { color: #ffd27a; }

  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .viewsel { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--chip); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .viewsel small { color: var(--amber); font-weight: 600; }
  .search { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
  .search input { border: 0; outline: none; background: none; flex: 1; min-width: 0; font-size: 13px; }
  .tool { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; white-space: nowrap; }
  .tool b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 4px; border-radius: 9px; background: var(--brand-600); color: #fff; font-size: 11px; }
  .primary { height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--brand-600); color: #fff; font-weight: 600; font-size: 13px; white-space: nowrap; }

  .table { flex: 1; overflow: auto; }
  .row { display: grid; grid-template-columns: 36px 80px minmax(240px, 1fr) 210px 130px 90px 130px; align-items: center; min-height: 38px; padding-right: 16px; border-bottom: 1px solid var(--line-soft); background: var(--surface); font-size: 13px; }
  .row > * { padding: 0 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.head { position: sticky; top: 0; z-index: 2; min-height: 32px; background: var(--bg); color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  .row:not(.head):not(.grp):hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .grp { position: sticky; top: 32px; z-index: 1; background: var(--group); min-height: 36px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font-weight: 600; }
  .grp .gname { display: flex; align-items: center; gap: 8px; grid-column: 1 / 6; padding-left: 12px; }
  .grp .gname i { font-style: normal; color: var(--faint); font-size: 11px; }
  .grp .gname small { color: var(--muted); font-weight: 500; }
  .grp .sum { grid-column: 7; text-align: right; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.doing { background: var(--brand-500); } .dot.done { background: var(--green); } .dot.gate { background: var(--amber-mark); }
  .num { text-align: right; }
  .key { color: var(--muted); font-size: 12px; }
  .title { font-weight: 500; }
  .state { display: inline-flex; gap: 4px; }
  .pill { font-size: 12px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  .pill.late { color: var(--red); background: var(--red-bg); }
  .pill.appr { color: var(--amber); background: var(--amber-bg); }
  .pill.blk { color: var(--muted); background: var(--chip); }
  .who { display: inline-flex; align-items: center; gap: 6px; }
  .av { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-100); color: var(--brand-900); font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; flex-shrink: 0; }
  .dark .av { background: var(--brand-900); color: var(--brand-100); }
  .sub { color: var(--muted); font-size: 12px; }
  .unit { color: var(--faint); font-size: 11px; margin-left: 3px; }
  input[type=checkbox] { accent-color: var(--brand-600); margin: 0 0 0 4px; }

  /* Drawer: a sheet with the workflow on top and tabs below. */
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
  .sheet { position: absolute; top: 8px; right: 8px; bottom: 8px; width: 640px; z-index: 6; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 48px -24px rgba(0,0,0,.45); }
  .sh-top { padding: 14px 20px 0; }
  .sh-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .sh-meta .acts { margin-left: auto; display: flex; gap: 6px; }
  .sh-meta .tool { height: 30px; }
  h1.t { font-size: 21px; line-height: 1.3; font-weight: 650; letter-spacing: -.015em; margin: 8px 0 14px; }
  /* Workflow track: where the item is, and where approval gates the way. */
  .track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 4px; }
  .step { font-size: 12px; color: var(--muted); }
  .step::before { content: ""; display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 6px; }
  .step.past::before { background: var(--brand-600); }
  .step.now { color: var(--text); font-weight: 600; }
  .step.now::before { background: repeating-linear-gradient(90deg, var(--amber-mark) 0 50%, color-mix(in oklab, var(--amber-mark) 30%, transparent) 50% 100%); }
  .step small { display: block; font-weight: 500; color: var(--amber); }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); padding: 0 20px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
  .tabs button { border: 0; background: none; padding: 10px 0; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button[aria-current] { color: var(--text); font-weight: 600; border-bottom-color: var(--brand-600); }
  .tabs button span { color: var(--faint); margin-left: 4px; }
  .sh-body { flex: 1; overflow: auto; padding: 16px 20px 24px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .f { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .f:nth-child(odd) { border-right: 1px solid var(--line); }
  .f:nth-last-child(-n+2) { border-bottom: 0; }
  .f dt { font-size: 12px; color: var(--muted); }
  .f dd { margin: 2px 0 0; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .f.big dd { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .late-t { color: var(--red); }
  .approve { display: flex; align-items: center; gap: 12px; margin: 16px 0; padding: 12px; border-radius: 10px; border: 1px solid color-mix(in oklab, var(--amber-mark) 45%, transparent); background: var(--amber-bg); }
  .approve .who-list { display: flex; gap: 4px; }
  .approve .av.ok { box-shadow: 0 0 0 2px var(--green); }
  .approve .av.wait { opacity: .55; }
  .approve p { margin: 0; flex: 1; font-size: 13px; }
  .approve p small { display: block; color: var(--muted); }
  .approve .primary { height: 34px; }
  .desc { line-height: 1.55; margin: 0; max-width: 64ch; }
  .label { font-size: 12px; color: var(--muted); margin: 18px 0 6px; }

  .phone-only { display: none; }
  @media (max-width: 700px) {
    header { padding: 0 12px; }
    .desk-only { display: none !important; }
    .phone-only { display: initial; }
    .q { padding: 8px 12px 10px; }
    .q strong { font-size: 18px; }
    .bar { padding: 8px 12px; flex-wrap: wrap; }
    .bar .search { order: 3; flex-basis: 100%; height: 40px; }
    .viewsel, .bar .tool { height: 40px; }
    .bar .tool { margin-left: auto; }
    .row.head { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) auto; padding: 10px 12px; gap: 4px 8px; align-items: start; }
    .row > * { padding: 0; }
    .row > .c-chk, .row > .c-key, .row > .c-state, .row > .c-who, .row > .c-due, .row > .c-amt { display: none; }
    .grp { top: 0; padding: 0 12px; }
    .grp .gname { grid-column: 1; padding: 0; }
    .grp .sum { grid-column: 2; }
    .m-title { white-space: normal; }
    .m-title .title { display: block; }
    .m-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
    .m-amt { text-align: right; font-weight: 600; }
    .scrim { display: none; }
    html:not(.show-drawer) .sheet { display: none; }
    .sheet { position: fixed; inset: 0; width: auto; border-radius: 0; border: 0; }
    .sh-top { padding: 8px 14px 0; }
    .sh-body { padding: 14px; }
    .fields { grid-template-columns: 1fr 1fr; }
    h1.t { font-size: 19px; }
    .tabs { padding: 0 14px; gap: 16px; }
    .tabs button { min-height: 44px; }
    .back { height: 40px; min-width: 40px; border: 0; background: none; font-size: 18px; color: var(--muted); margin-left: -8px; }
    .approve { flex-wrap: wrap; }
    .approve .primary { width: 100%; height: 44px; }
  }
  .hide-drawer .sheet, .hide-drawer .scrim { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="../../brand/logo-mark.png" alt="" />
    <nav class="crumbs"><span class="desk-only">FinOps</span><span class="desk-only">/</span><b>Mühasibatlıq</b></nav>
    <div class="hdr-right">
      <button class="ghost" aria-label="Axtarış">⌕</button>
      <button class="ghost" aria-label="Bildirişlər">🔔</button>
      <span class="desk-only" style="font-size:12px;opacity:.8">AZ ◐</span>
      <button class="ghost">Çıxış</button>
    </div>
  </header>
  <nav class="queues" aria-label="Növbələr">
    <button class="q" aria-pressed="true"><strong>12</strong><span>Hamısı</span></button>
    <button class="q"><strong>3</strong><span>Mənə təyin</span></button>
    <button class="q late"><strong>2</strong><span>Gecikmiş</span></button>
    <button class="q appr"><strong>3</strong><span>Təsdiq gözləyir</span></button>
    <button class="q"><strong>2</strong><span>Bloklanmış</span></button>
    <button class="q"><strong>4</strong><span>Bu həftə bitir</span></button>
  </nav>
  <div class="bar">
    <span class="viewsel">Bu ay bağlanış ▾ <small class="desk-only">dəyişib</small><small class="phone-only">●</small></span>
    <label class="search"><span style="color:var(--faint)">⌕</span><input placeholder="Başlıq, açar və ya məbləğ" /></label>
    <button class="tool">Filtrlər<b>2</b></button>
    <button class="tool desk-only">Qrup: status</button>
    <button class="tool desk-only">Sırala</button>
    <button class="tool desk-only">Sütunlar</button>
    <button class="primary desk-only">Yeni tapşırıq</button>
  </div>
  <div class="table" id="tbl" role="table"></div>
  <div class="scrim desk-only"></div>
  <aside class="sheet" id="sheet"></aside>
</div>
<script>
  const { items, statuses, people, fmt } = NB;
  const ini = (w) => (w ? people[w].split(" ").map((p) => p[0]).join("") : "");
  const state = (s, it) => [
    s.overdue ? `<span class="pill late">${parseInt(it.dueRel)} gün gecikib</span>` : "",
    s.approval ? `<span class="pill appr">Təsdiq ${s.approval[0]}/${s.approval[1]}</span>` : "",
    s.blocked ? `<span class="pill blk">Bloklanıb</span>` : "",
  ].join("");
  let html = `<div class="row head"><span><input type="checkbox" aria-label="Hamısını seç"></span><span>Açar</span><span>Başlıq</span><span>Vəziyyət</span><span>Cavabdeh</span><span>Son tarix</span><span class="num">Məbləğ, ₼</span></div>`;
  [2, 1, 0, 3].forEach((si) => {
    const st = statuses[si];
    const rows = items.filter((it) => it.status === si);
    const sum = rows.reduce((n, it) => n + it.amount, 0);
    html += `<div class="row grp"><span class="gname"><i>▾</i><span class="dot ${st.gate ? "gate" : st.cat}"></span>${st.name}<small>${rows.length}</small>${st.gate ? `<small style="color:var(--amber)">təsdiq tələb edir</small>` : ""}</span><span class="sum">${fmt(sum)}</span></div>`;
    for (const it of rows) {
      const s = it.signals;
      html += `<div class="row ${it.key === "FIN-209" ? "sel" : ""}">
        <span class="c-chk"><input type="checkbox" aria-label="Seç"></span>
        <span class="key c-key">${it.key}</span>
        <span class="m-title"><span class="title">${it.title}</span>${s.subtasks ? `<span class="sub desk-only"> ${s.subtasks[0]}/${s.subtasks[1]} alt</span>` : ""}
          <span class="m-meta phone-only"><span>${it.key}</span>${state(s, it)}${it.who ? `<span class="av">${ini(it.who)}</span>` : ""}${!s.overdue && it.due ? `<span>${it.due}</span>` : ""}</span></span>
        <span class="c-state"><span class="state">${state(s, it)}</span></span>
        <span class="c-who">${it.who ? `<span class="who"><span class="av">${ini(it.who)}</span>${people[it.who]}</span>` : `<span style="color:var(--faint)">—</span>`}</span>
        <span class="c-due ${s.overdue ? "late-t" : ""}">${it.due || "—"}</span>
        <span class="num c-amt">${fmt(it.amount)}</span>
        <span class="m-amt phone-only">${it.amount ? fmt(it.amount) : ""}</span>
      </div>`;
    }
  });
  document.getElementById("tbl").innerHTML = html;

  document.getElementById("sheet").innerHTML = `
    <div class="sh-top">
      <div class="sh-meta"><button class="back phone-only" aria-label="Geri">‹</button><span>FIN-209</span><span>Ödəniş</span>
        <div class="acts"><button class="tool desk-only">İzlə</button><button class="tool desk-only">Sübut paketi</button><button class="tool">⋯</button><button class="tool desk-only" aria-label="Bağla">✕</button></div></div>
      <h1 class="t">Kontragent 0142 üzrə ödəniş tapşırığı</h1>
      <div class="track" aria-label="İş axını">
        <span class="step past">Görüləcək</span><span class="step past">İcrada</span>
        <span class="step now">Yoxlamada<small>təsdiq 1/2</small></span><span class="step">Tamamlandı</span>
      </div>
    </div>
    <nav class="tabs"><button aria-current="true">Ümumi</button><button>Alt tapşırıqlar<span>1/3</span></button><button>Əlaqələr<span>2</span></button><button>Fayllar<span>2</span></button><button>Şərhlər<span>4</span></button><button>Tarixçə</button></nav>
    <div class="sh-body">
      <dl class="fields">
        <div class="f big"><dt>Məbləğ</dt><dd>42 800,00<span class="unit">₼</span></dd></div>
        <div class="f"><dt>Son tarix</dt><dd class="late-t">21 noy 2026 <span class="pill late">3 iş günü gecikib</span></dd></div>
        <div class="f"><dt>Cavabdeh</dt><dd><span class="av">RK</span>Rauf K.</dd></div>
        <div class="f"><dt>Müəllif</dt><dd><span class="av">LH</span>Leyla H.</dd></div>
        <div class="f"><dt>Kontragent</dt><dd>Kontragent 0142</dd></div>
        <div class="f"><dt>Xərc mərkəzi</dt><dd>CC-04 Əməliyyatlar</dd></div>
      </dl>
      <div class="approve">
        <span class="who-list"><span class="av ok">TS</span><span class="av wait">NQ</span></span>
        <p><b>Daha bir təsdiq lazımdır</b><small>Tofiq S. təsdiqlədi, Nigar Q. gözlənilir</small></p>
        <button class="primary">Təsdiqlə</button>
      </div>
      <div class="label">Təsvir</div>
      <p class="desc">Noyabr müqaviləsi üzrə ikinci hissə. Hesab-faktura reyestrdə yoxlanıb; bank rekvizitləri ötən ödənişlə eynidir.</p>
      <div class="label">Bloklayan</div>
      <p class="desc"><span class="key">FIN-196</span> Kontragent 0388 ilə üzləşmə aktı <span class="pill blk">İcrada</span></p>
    </div>`;
</script>
</body>
</html>
