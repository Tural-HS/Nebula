# Nebula production PostgreSQL configuration (mounted read-only; changes need a restart/reload).
# Sizing assumes a 2 GiB container limit on a 4-8 GiB VPS. Tune with the host, then restart.

listen_addresses = '*'          # only reachable on the internal "db" network
port = 5432
max_connections = 100           # Nebula pool 20 + Keycloak ~20 + monitoring/backup headroom
password_encryption = scram-sha-256
hba_file = '/var/lib/postgresql/19/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/19/docker/pg_ident.conf'
data_directory = '/var/lib/postgresql/19/docker'
unix_socket_directories = '/var/run/postgresql'

# Memory
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# WAL, checkpoints and archiving (pgBackRest)
wal_level = replica
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'nebula-pgbackrest --stanza=nebula archive-push %p'   # wrapper: pgbackrest + secrets
# Force a WAL segment switch at least every 60 s when there was activity: bounds the RPO.
archive_timeout = 60
max_wal_senders = 3             # pgBackRest backups use replication-safe functions; headroom for a replica later

# Safety
fsync = on
synchronous_commit = on
full_page_writes = on

# Observability
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = 'authentication'
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 10s

# Locale/time
timezone = 'UTC'
log_timezone = 'UTC'
