# pgBackRest configuration. Connection details for the S3 repository and all secrets come from
# PGBACKREST_* environment variables (compose.yaml + nebula-entrypoint.sh), never from this file.
[global]
# Generated restore_command/archive_command must use the wrapper that loads the repository secrets.
cmd=/usr/local/bin/nebula-pgbackrest
repo1-type=s3
# Client-side encryption: the object store only ever sees ciphertext.
repo1-cipher-type=aes-256-cbc
# Weekly full + daily differential (scripts/backup.sh via systemd timers). Keep 4 full backups,
# i.e. ~4 weeks of point-in-time recovery; WAL older than the oldest full backup is expired.
repo1-retention-full-type=count
repo1-retention-full=4
repo1-retention-diff=7
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
# Asynchronous archiving: WAL is queued in the spool volume and pushed in batches, so a slow or
# unavailable object store does not stall commits (archive-push-queue-max caps disk use).
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB
archive-timeout=120
lock-path=/tmp/pgbackrest
log-path=/tmp/pgbackrest
log-level-console=info
log-level-file=off
log-level-stderr=warn

[global:archive-push]
process-max=2

[global:archive-get]
process-max=2

[nebula]
pg1-path=/var/lib/postgresql/19/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
