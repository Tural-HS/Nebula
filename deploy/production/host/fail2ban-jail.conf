# /etc/fail2ban/jail.d/nebula.local  (apt install fail2ban; systemctl restart fail2ban)
# Debian 13 has no /var/log/auth.log by default: read sshd from the journal.
[DEFAULT]
backend  = systemd
bantime  = 1h
findtime = 10m
maxretry = 5
# Repeat offenders: ban time doubles each time, up to one week.
bantime.increment = true
bantime.maxtime   = 1w

[sshd]
enabled = true
