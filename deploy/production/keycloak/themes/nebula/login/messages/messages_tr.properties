# Nebula login theme (ADR-0036). UTF-8. MessageFormat: a literal apostrophe is written ''.
# keycloak.v2's template.ftl renders loginTitleHtml (sanitized by kcSanitize: div/span/strong/small
# with class and title are allowed) inside #kc-header-wrapper; nebula.css turns it into the brand
# panel. {0} is the realm display name: shown as a small caption, hidden by CSS when it is just
# "Nebula" (title attribute match).
loginTitleHtml=<div class="nb-brand"><strong class="nb-brand-name">Nebula</strong><span class="nb-tagline">Ekibinizin işleri tek yerde</span></div><small class="nb-realm" title="{0}">{0}</small>
