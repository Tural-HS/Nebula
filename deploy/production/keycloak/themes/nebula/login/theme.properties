# Nebula login theme (ADR-0036): a CSS-only extension of Keycloak's keycloak.v2 (PatternFly 5).
# No templates are overridden, so Keycloak upgrades keep their own markup and fixes; review
# resources/css/nebula.css against the new keycloak.v2 when bumping the Keycloak version.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's own styles.css (resolved from the parent) first, then the Nebula layer.
# Every other property (stylesCommon, kc*Class) is inherited from keycloak.v2.
# BUMP ?v= WHENEVER nebula.css CHANGES. Keycloak serves theme files under /resources/<version>/
# with Cache-Control max-age=30 days, and <version> depends only on the Keycloak version and
# build options, not on theme content: without a new query string, browsers keep the old CSS.
styles=css/styles.css css/nebula.css?v=2

# Follow the OS colour scheme: keycloak.v2 adds kcDarkModeClass (pf-v5-theme-dark) to <html>.
darkMode=true
