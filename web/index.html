<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: safe-area insets (notch, home bar) are applied in CSS.
         interactive-widget: Android shrinks the layout for the keyboard, so
         fixed panels stay above it. Zoom stays allowed (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="theme-color" content="#16788b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <title>Nebula</title>
    <!-- Applies the stored colour theme before the first paint (ADR-0035).
         Same-origin classic script: the CSP allows no inline code. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
